name: Deploy to GitHub Pages

# Publishes the app to https://neyron357-boop.github.io/MyGarage-/ after every push to main that
# changes the app (docs-only and e2e-only changes are skipped), or manually: Actions →
# "Deploy to GitHub Pages" → Run workflow. Settings → Pages → Source is "GitHub Actions".
# Only the app files are published (HTTPS, installable on phones); all garage data stays on the device.
on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '!app/e2e/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time: a newer push waits instead of cancelling a deployment halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
